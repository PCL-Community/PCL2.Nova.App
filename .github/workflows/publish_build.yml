name: 'Publish App'

on:
  workflow_dispatch:

# This workflow will trigger on each push to the build branchs to create or update a GitHub release, build your app, and upload the artifacts to the release.

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-13' # for Intel based macs.
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04' # for Tauri v1 you could replace this with ubuntu-20.04.
            args: '--target x86_64-unknown-linux-gnu'
          - platform: 'ubuntu-22.04-arm'
            args: '--target aarch64-unknown-linux-gnu'
          - platform: 'windows-latest'
            args: '--target x86_64-pc-windows-msvc'
          - platform: 'windows-arm'
            args: '--target aarch64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust Nightly (MacOS x64)
        uses: dtolnay/rust-toolchain@nightly
        if: matrix.platform == 'macos-13'
        with:
          targets: 'x86_64-apple-darwin'
          
      - name: install Rust Nightly (MacOS ARM64)
        uses: dtolnay/rust-toolchain@nightly
        if: matrix.platform == 'macos-latest'
        with:
          targets: 'aarch64-apple-darwin'
          
      - name: install Rust Nightly (Windows x64)
        uses: dtolnay/rust-toolchain@nightly
        if: matrix.platform == 'windows-latest'
        with:
          targets: 'x86_64-pc-windows-msvc'
          
      - name: install Rust Nightly (Windows ARM64)
        uses: dtolnay/rust-toolchain@nightly
        if: matrix.platform == 'windows-arm'
        with:
          targets: 'aarch64-pc-windows-msvc'
          
      - name: install Rust Nightly (Linux x64)
        uses: dtolnay/rust-toolchain@nightly
        if: matrix.platform == 'ubuntu-22.04'
        with:
          targets: 'x86_64-unknown-linux-gnu'

      - name: install Rust Nightly (Linux ARM64)
        uses: dtolnay/rust-toolchain@nightly
        if: matrix.platform == 'ubuntu-22.04-arm'
        with:
          targets: 'aarch64-unknown-linux-gnu'

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
        # webkitgtk 4.1 is for Tauri v2.
      
      - name: install frontend dependencies
        run: | # change this to npm, pnpm or bun depending on which one you use.
          npm install -g pnpm
          pnpm install 
      
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: __VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version.
          releaseName: __VERSION__
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
