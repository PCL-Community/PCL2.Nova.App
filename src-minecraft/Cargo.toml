[package]
name = "nova_mcore"
version = "0.0.0"
authors = ["PCL-Community Nova Team"]
edition = "2021"
license = "GPL-3.0"

[lib]
crate-type = ["staticlib"]

[dependencies]
anyhow = "1.0.97"
dirs-next = "2.0.0"
futures-util = "0.3.31"
regex = "1.11.1"
reqwest = { version = "0.12.14", features = ["stream", "json"]}
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sysinfo = { version = "0.33.1", features = ["serde"] } 
tokio = { version = "1.44.1", features = ["rt-multi-thread"] }
uuid = { version = "1.16.0", features = ["v4"] }
